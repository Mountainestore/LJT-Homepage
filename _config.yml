# Site Settings
title: Junteng Liu
url: "https://Mountainestore.github.io"
baseurl: "/LJT-Homepage"
repository: "Mountainestore/LJT-Homepage"

# Author Settings
author:
  name: Junteng Liu
  avatar: "/images/profile.png"
  bio: "First-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning, with interests in LLM Reasoning and Reinforcement Learning, Hallucination in Vision-Language Models, and LLM Truthfulness and Interpretability."
  email: jliugi@connect.ust.hk
  github: Vicent0205
  twitter: junteng88716710
  google_scholar: https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate

# Social Link Settings
footer_link:
  github: Vicent0205
  twitter: junteng88716710
  google_scholar: https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate
  email: jliugi@connect.ust.hk

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:collection/:path/

# Markdown Processing
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio"
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "talk"
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "teaching"

# HTML Compression
compress_html:
  clippings: all
  comments: all

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from

# Theme
theme: minima

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - docker-compose.yaml
  - Dockerfile
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - talkmap/
  - scripts/
  - markdown_generator/
